name: Image Harvester CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  tests-and-deb:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install GTK and virtual display
        run: sudo apt-get update && sudo apt-get install -y python3-gi gir1.2-gtk-3.0 xvfb
      - name: Test engine and Arabic GUI
        run: xvfb-run -a /usr/bin/python3 -m unittest discover -s tests -v
      - name: Build Debian package
        run: bash packaging/build-deb.sh "$GITHUB_WORKSPACE/image-harvester_0.1.1-1_all.deb"
      - name: Inspect package
        run: |
          dpkg-deb --info image-harvester_0.1.1-1_all.deb
          dpkg-deb --contents image-harvester_0.1.1-1_all.deb
      - uses: actions/upload-artifact@v4
        with:
          name: image-harvester-debian-v0.1.1
          path: image-harvester_0.1.1-1_all.deb
          if-no-files-found: error
