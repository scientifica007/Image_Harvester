name: Import Image Harvester sources
on:
  push:
    branches: [main]
    paths:
      - '.bootstrap/source.tar.xz'

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Extract and commit source tree
        shell: bash
        run: |
          set -euo pipefail
          tar -xJf .bootstrap/source.tar.xz
          rm -rf .bootstrap
          rm .github/workflows/import-source.yml
          rmdir .github/workflows
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Import Image Harvester v0.1.0 application source"
          git push origin HEAD:main
